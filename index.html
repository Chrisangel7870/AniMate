<html lang="en"><head><meta charset="utf-8">

<meta name="theme-color" content="#14110f"><title>FlipAnim Studio</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#14110f;--pn:#1f1b18;--ln:#352f2a;--tx:#ece6df;--mu:#9a8f84;--ac:#ff7a3d}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--tx);font:500 13px/1.2 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);user-select:none;-webkit-user-select:none}
button,input,select{font:inherit;color:inherit}
.b{background:var(--pn);border:1px solid var(--ln);border-radius:10px;min-width:38px;min-height:38px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;flex:none}
.b:disabled{opacity:.35}.b.on{background:var(--ac);border-color:var(--ac);color:#1b0d05}
#top,#tl .row{display:flex;gap:6px;align-items:center;padding:6px 8px;overflow-x:auto;flex:none;scrollbar-width:none}
#top{background:var(--pn);border-bottom:1px solid var(--ln)}
.sp{flex:1}.lg{font-weight:800;letter-spacing:.2px;flex:none;margin-right:4px}.lg i{color:var(--ac);font-style:normal}
#main{flex:1;min-height:0;display:flex}
#rail{width:58px;flex:none;display:flex;flex-direction:column;gap:6px;padding:8px 6px;background:var(--pn);border-right:1px solid var(--ln);align-items:center}
#brushes{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;scrollbar-width:none;min-height:0}
#col{width:40px;height:40px;border:2px solid var(--tx);border-radius:50%;padding:0;background:none;flex:none;cursor:pointer}
#col::-webkit-color-swatch-wrapper{padding:0}#col::-webkit-color-swatch{border:0;border-radius:50%}
#view{flex:1;position:relative;overflow:hidden;touch-action:none;background:repeating-conic-gradient(#1c1815 0 25%,#171310 0 50%) 0 0/24px 24px;cursor:crosshair}
#stage{position:absolute;left:50%;top:50%;background:#fff;box-shadow:0 12px 50px #000c;will-change:transform}
#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#ring{position:absolute;border:1.5px solid #fff;outline:1px solid #000;border-radius:50%;pointer-events:none;display:none;transform:translate(-50%,-50%)}
#zoom{position:absolute;right:8px;top:8px;display:flex;gap:4px;align-items:center;background:#1f1b18e6;border:1px solid var(--ln);border-radius:12px;padding:3px}
#zoom .b{min-height:32px;min-width:32px}#zt{min-width:42px;text-align:center}
#panel{position:absolute;left:8px;bottom:8px;width:min(280px,calc(100% - 16px));background:#1f1b18f2;border:1px solid var(--ln);border-radius:16px;padding:12px;display:none;flex-direction:column;gap:9px;max-height:calc(100% - 16px);overflow:auto}
#panel.show{display:flex}
#panel label{display:flex;align-items:center;gap:8px}#panel label span:first-child{width:74px;color:var(--mu);flex:none}
#panel input[type=range]{flex:1;accent-color:var(--ac);min-width:0}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.sw i{aspect-ratio:1;border-radius:50%;border:2px solid var(--ln);cursor:pointer}
#tl{background:var(--pn);border-top:1px solid var(--ln);flex:none}
#reel{display:flex;gap:8px;padding:2px 8px 8px;overflow-x:auto;scrollbar-width:thin}
.fr{flex:none;width:88px;border:2px solid var(--ln);border-radius:10px;padding:3px;background:var(--bg);cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center}
.fr canvas{width:100%;height:auto;border-radius:6px;background:#fff;display:block}.fr span{font-size:10px;color:var(--mu)}
.fr.on{border-color:var(--ac)}.fr.on span{color:var(--ac)}
#fps{width:44px;background:var(--bg);border:1px solid var(--ln);border-radius:8px;text-align:center;padding:8px 2px}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ac);color:#1b0d05;padding:5px 10px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;font-size:12px}
dialog{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:18px;padding:16px;width:min(92vw,340px)}dialog::backdrop{background:#000a}
dialog form{display:flex;flex-direction:column;gap:12px}dialog select{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px}
dialog progress{width:100%;accent-color:var(--ac)}.dr{display:flex;gap:8px;justify-content:flex-end}
@media(max-width:700px){.lb{display:none}#rail{width:50px;padding:6px 4px}#col{width:34px;height:34px}.fr{width:72px}}
@media(max-height:480px){.fr{width:60px}.fr span{display:none}}

</div>
<div id="main">
 <div id="rail"><input type="color" id="col" value="#111111" title="Colour"><div id="brushes"></div><button class="b" id="bSet" title="Brush, colour &amp; onion settings">⚙</button></div>
 <div id="view">
  <div id="stage"></div><div id="ring"></div>
  <div id="zoom"><button class="b" id="zo">−</button><span id="zt">100%</span><button class="b" id="zi">+</button><button class="b" id="zr" title="Fit to screen">Fit</button></div>
  <div id="panel">
   <label><span>Size</span><input type="range" id="sSize" min="1" max="200"><span id="vSize" style="width:34px;color:var(--tx)"></span></label>
   <label><span>Opacity</span><input type="range" id="sOp" min="5" max="100"></label>
   <label><span>Stabilizer</span><input type="range" id="sSm" min="0" max="90"></label>
   <div class="sw" id="sw"></div>
   <label><span>Onion fade</span><input type="range" id="sOn" min="5" max="90" value="35"></label>
   <label><span>Onion frames</span><span style="flex:1;display:flex;gap:14px"><label><input type="checkbox" id="oP" checked> Prev</label><label><input type="checkbox" id="oN"> Next</label></span></label>
  </div>
  <div id="toast"></div>
 </div>
</div>
<div id="tl">

  <button class="b on" id="bLoop" title="Loop">🔁</button><input id="fps" type="number" min="1" max="60" value="12" title="Frames per second"><span id="cnt" style="color:var(--mu);min-width:42px">1/1</span>

 </div>
 <div id="reel"></div>
</div>
<dialog id="dNew"><form method="dialog"><b>New project</b><select id="preset"><option value="1280x720">1280 × 720 (16:9)</option><option value="1920x1080">1920 × 1080 (Full HD)</option><option value="960x540">960 × 540 (light)</option><option value="1080x1080">1080 × 1080 (square)</option><option value="1080x1920">1080 × 1920 (vertical)</option><option value="1024x768">1024 × 768 (4:3)</option></select><span style="color:var(--mu)">Current drawing will be replaced.</span><div class="dr"><button class="b" value="x">Cancel</button><button class="b on" value="ok">Create</button></div></form></dialog>
<dialog id="dExp"><form method="dialog" onsubmit="return false"><b>Export</b><select id="xf"><option value="v">Video (WebM / MP4)</option><option value="p">Current frame (PNG)</option></select><label><input type="checkbox" id="xt"> Transparent background (PNG)</label><progress id="xp" value="0" max="1" hidden></progress><div class="dr"><button class="b" id="xc" type="button">Close</button><button class="b on" id="xg" type="button">Export</button></div></form></dialog>
