name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Generate Android project
        run: |
          mkdir -p app/src/main/java/com/flipanim/app app/src/main/assets app/src/main/res/values
          sed '/^```/d' index.html > app/src/main/assets/index.html
          sed -i 's#</body>#<script src="bridge.js"></script></body>#' app/src/main/assets/index.html

          cat > app/src/main/assets/bridge.js <<'EOF'
          (function(){
            var oc = HTMLAnchorElement.prototype.click;
            function send(name, mime, b64){ Android.save(name || 'file', mime || '', b64); }
            HTMLAnchorElement.prototype.click = function(){
              var a = this, h = a.href;
              if (a.download && h) {
                if (h.indexOf('blob:') === 0) {
                  fetch(h).then(function(r){ return r.blob(); }).then(function(b){
                    var fr = new FileReader();
                    fr.onload = function(){ send(a.download, b.type, fr.result.split(',')[1]); };
                    fr.readAsDataURL(b);
                  });
                  return;
                }
                if (h.indexOf('data:') === 0) {
                  send(a.download, h.substring(5, h.indexOf(';')), h.split(',')[1]);
                  return;
                }
              }
              oc.call(this);
            };
          })();
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "FlipAnim"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.flipanim.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.flipanim.app'
              minSdk 29
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:Theme.DeviceDefault.NoActionBar">
              <item name="android:statusBarColor">#020617</item>
              <item name="android:navigationBarColor">#020617</item>
              <item name="android:windowBackground">#020617</item>
            </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="FlipAnim" android:theme="@style/AppTheme">
              <activity android:name=".MainActivity" android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode"
                android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/flipanim/app/MainActivity.java <<'EOF'
          package com.flipanim.app;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.*;
          import android.widget.Toast;
          import java.io.OutputStream;

          public class MainActivity extends Activity {
            WebView web;
            ValueCallback<Uri[]> fileCb;

            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              web = new WebView(this);
              setContentView(web);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              web.addJavascriptInterface(new Bridge(), "Android");
              web.setWebViewClient(new WebViewClient());
              web.setWebChromeClient(new WebChromeClient() {
                @Override
                public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  if (fileCb != null) fileCb.onReceiveValue(null);
                  fileCb = cb;
                  Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  try { startActivityForResult(i, 1); }
                  catch (Exception e) { fileCb = null; return false; }
                  return true;
                }
              });
              web.loadUrl("file:///android_asset/index.html");
            }

            @Override
            protected void onActivityResult(int req, int res, Intent data) {
              if (req == 1 && fileCb != null) {
                Uri[] r = null;
                if (res == RESULT_OK && data != null && data.getData() != null) r = new Uri[]{ data.getData() };
                fileCb.onReceiveValue(r);
                fileCb = null;
              }
            }

            class Bridge {
              @JavascriptInterface
              public void save(String name, String mime, String b64) {
                try {
                  byte[] d = Base64.decode(b64, Base64.DEFAULT);
                  ContentValues v = new ContentValues();
                  v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                  v.put(MediaStore.Downloads.MIME_TYPE, (mime == null || mime.isEmpty()) ? "application/octet-stream" : mime);
                  v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                  Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                  OutputStream o = getContentResolver().openOutputStream(u);
                  o.write(d);
                  o.close();
                  runOnUiThread(() -> Toast.makeText(MainActivity.this, "Saved to Downloads: " + name, Toast.LENGTH_LONG).show());
                } catch (Exception e) {
                  runOnUiThread(() -> Toast.makeText(MainActivity.this, "Save failed", Toast.LENGTH_LONG).show());
                }
              }
            }
          }
          EOF
      - name: Build
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FlipAnim-APK
          path: app/build/outputs/apk/debug/app-debug.apk
